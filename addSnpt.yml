# espanso match file v1.0

  # And much more! For more information, visit the docs: https://espanso.org/docs/
matches:

# for file format

  - trigger: "--fday"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y%m%d%H%M"

  - trigger: "--day"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y%m%d"

# for Main

  - trigger: ",,fullday"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y/%m/%d %H:%M"

  - trigger: ",,today"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y/%m/%d "


  - trigger: ",,now"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M "

  - trigger: ",,time"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%H:%M "

  - trigger: ",,lorem"
    replace: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."

  - trigger: ",,dummy"
    replace: ""

  - trigger: ",,count"
    replace: "@文字数カウンター"

  - trigger: ",,beryl"
    replace: "#猫のいる暮らし #CatsLover #猫好きさんと繋がりたい #猫 #保護猫と暮らす "


  - trigger: ",,cr"
