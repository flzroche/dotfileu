  - trigger: "..git"
    replace: "https://github.com/flzroche/"

  - trigger: "..ccc"
    replace: "https://github.com/flzroche/ccc-CITRUS-CIRCUIT-CIRCLE"

## - 小説関連
  - trigger: "==1"
    replace: "● "

  - trigger: "==2"
    replace: "○ "

  - trigger: "==3"
    replace: "■ " 
    
  - trigger: "==c"
    replace: "@文字数カウンター"

  - trigger: "==d"
    replace: "――"

  - trigger: "==star1"
    replace: "★ "

  - trigger: "==star2"
    replace: "☆ "

  - trigger: "==4"
    replace: "♢ "

  - trigger: "==m"
    replace: "♂︎"

  - trigger: "==f "
    replace: "♀︎"

  - trigger: "==bs "
    replace: "⌫ "

  - trigger: "==hosi"
    replace: "★"

  - trigger: "==kome"
    replace: "※"

  - trigger: "#cmd"
    replace: "⌘"

  - trigger: "#alt"
    replace: "⌥"

  - trigger: "#option"
    replace: "⌥"

  - trigger: "#skey"
    replace: "^⌥ ⌘ "

## SIBAN

  - trigger: "#env"
    replace: "#!/usr/bin/env bash"

  - trigger: "#ruby"
    replace: "#!/usr/bin/env ruby"

  - trigger: "#rb"
    replace: "#!/usr/bin/env ruby"

  - trigger: "#bash"
    replace: "#!/bin/bash"

  - trigger: "#zsh"
    replace: "#!/bin/zsh"

############# コマンド #################
  - trigger: "#1g"
    replace: "g/^$/,/./-1join"

  - trigger: "#react"
    replace: "npm create vite@latest my-app -- --template react"

  # 半角英数字1文字以上
  - trigger: "#alnum"
    replace: "[0-9A-Za-z]+"
  
  # 半角英数字＋アンダースコア
  - trigger: "#word"
    replace: "[0-9A-Za-z_]+"
  
  # 単語境界つき
  - trigger: "#bword"
    replace: "\\b[0-9A-Za-z_]+\\b"
  
  # メールアドレスっぽい
  - trigger: "#email"
    replace: '[0-9A-Za-z._%+-]+@[0-9A-Za-z.-]+\.[A-Za-z]+'
  
  # 日本の郵便番号
  - trigger: "#zip"
    replace: "[0-9]{3}-[0-9]{4}"
  
  # 日本の電話番号
  - trigger: "#tel"
    replace: "[0-9]{2,4}-[0-9]{2,4}-[0-9]{3,4}"


